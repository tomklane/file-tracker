[package]
name = "file_tracker"
version = "1.1.0"
edition = "2021"
description = "Scan a folder and fill a tracking spreadsheet, or copy the list into any spreadsheet."

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
rfd = "0.17"
umya-spreadsheet = "2.3"
csv = "1.3"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"
url = "2"
open = "5"
dirs = "6"
regex = "1"
notify = "8"

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.bundle]
name = "File Tracker"
identifier = "com.filetracker.app"
